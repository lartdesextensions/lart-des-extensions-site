<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Création table clients — à usage unique</title>
<style>
body{font-family:sans-serif;padding:20px;background:#FAF8F5;}
button{padding:14px 24px;font-size:16px;background:#1F1F1F;color:#fff;border:none;border-radius:8px;cursor:pointer;}
#log{margin-top:20px;white-space:pre-wrap;font-family:monospace;font-size:13px;background:#fff;padding:16px;border-radius:8px;border:1px solid #ddd;max-height:70vh;overflow:auto;}
</style>
</head>
<body>
<h2>Créer la table clients</h2>
<p>Cette page crée la table "clients" et y importe automatiquement les clientes déjà présentes dans tes réservations existantes (pour ne pas repartir de zéro). Clique une seule fois, attends la fin, puis <strong>supprime ce fichier de GitHub</strong> (et migrate-create-clients.js).</p>
<button onclick="run()">Lancer la création</button>
<div id="log"></div>

<script>
const logEl = document.getElementById('log');
function log(msg) {
  logEl.textContent += msg + '\n';
  logEl.scrollTop = logEl.scrollHeight;
}

async function run() {
  log('Démarrage...\n');
  try {
    const res = await fetch('/.netlify/functions/migrate-create-clients', { method: 'POST' });
    const data = await res.json();
    (data.log || []).forEach(line => log(line));
    if (!res.ok) {
      log('\nÉchec. Regarde le message d\'erreur ci-dessus.');
    } else {
      log('\nTu peux maintenant supprimer ce fichier et migrate-create-clients.js de GitHub.');
    }
  } catch (e) {
    log('✗ ERREUR : ' + e.message);
  }
}
</script>
</body>
</html>
