[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@libsql/client"]

# Suppression automatique des réservations abandonnées (non payées depuis 24 h)
[functions."nettoyage-reservations"]
  schedule = "@hourly"
  external_node_modules = ["@libsql/client"]

# Liste d'attente : prévient les clientes quand un créneau se libère
[functions."liste-attente-verif"]
  schedule = "*/15 * * * *"
  external_node_modules = ["@libsql/client"]
