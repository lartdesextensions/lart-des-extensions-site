const logEl = document.getElementById('log');
function log(msg) {
  logEl.textContent += msg + '\n';
  logEl.scrollTop = logEl.scrollHeight;
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function dbCall(table, action, opts) {
  const res = await fetch('/.netlify/functions/db', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ table, action }, opts || {}))
  });
  const json = await res.json();
  if (!res.ok) {
    let msg = json.error || 'Erreur base de données';
    if (json.errorName) msg += ' [' + json.errorName + ']';
    if (json.errorStack) msg += '\n    ' + json.errorStack.split('\n').slice(0, 4).join('\n    ');
    throw new Error(msg);
  }
  return json;
}

async function insertWithRetry(p, ordre, maxAttempts) {
  let lastErr;
  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    try {
      await dbCall('prestations', 'insert', {
        payload: { nom: p.nom, prix: p.prix, duree_min: p.duree_min, actif: true, ordre: ordre }
      });
      return true;
    } catch (e) {
      lastErr = e;
      if (attempt < maxAttempts) await sleep(400 * attempt);
    }
  }
  throw lastErr;
}

async function run() {
  log('Vérification des prestations déjà présentes en base...');
  let existingNoms = new Set();
  try {
    const { data } = await dbCall('prestations', 'select', {});
    existingNoms = new Set(data.map(r => r.nom));
    log(existingNoms.size + ' prestations déjà en base (seront ignorées).');
  } catch (e) {
    log('Impossible de lire les prestations existantes (' + e.message + '), on continue quand même.');
  }

  const aInserer = PRESTATIONS.filter(p => !existingNoms.has(p.nom));
  log('Démarrage de l\'import de ' + aInserer.length + ' prestations manquantes...\n');

  let ordre = existingNoms.size + 1;
  let success = 0, fail = 0;
  for (const p of aInserer) {
    try {
      await insertWithRetry(p, ordre, 3);
      success++;
      log('✓ ' + p.nom + ' (' + p.prix + '€, ' + p.duree_min + ' min)');
    } catch (e) {
      fail++;
      log('✗ ERREUR sur "' + p.nom + '" : ' + e.message);
    }
    ordre++;
    await sleep(150);
  }
  log('\nTerminé : ' + success + ' insérées, ' + fail + ' échouées.');
  if (fail === 0) {
    log('Tu peux maintenant supprimer ce fichier de GitHub.');
  } else {
    log('Relance simplement l\'import une seconde fois : les prestations déjà réussies seront ignorées automatiquement.');
  }
}
